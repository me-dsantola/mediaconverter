name: Compilar APK Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Gerar APK com Flet
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar código do repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Java 17 (Requisito Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 3. Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 5. Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 6. Instalar Flet e dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          else
            pip install flet yt-dlp
          fi

      - name: 7. Compilar o APK
        run: |
          if [ -f "mobile_main.py" ] && [ ! -f "main.py" ]; then
            cp mobile_main.py main.py
          fi
          # Garante que o Flutter está no PATH para o Flet encontrar
          export PATH="$FLUTTER_ROOT/bin:$PATH"
          flet build apk --verbose

      - name: 8. Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: MediaGrabPro-Android-APK
          path: build/apk/app-release.apk
